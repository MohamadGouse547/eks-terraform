
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2

  role: karpenter-role-prod-eks

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod-eks

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod-eks

  userData: |
    #!/bin/bash
    set -ex
    /etc/eks/bootstrap.sh prod-eks

  tags:
    karpenter.sh/discovery: prod-eks

